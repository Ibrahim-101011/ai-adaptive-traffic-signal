system:
  video_source: "sim"    # Options: "sim", "webcam", or "path/to/video.mp4"
  camera_index: 0
  frame_skip: 1

detector:
  model_path: "models/yolov8n.pt"
  confidence_threshold: 0.15
  target_classes: [2, 3, 5, 7] # car, motorcycle, bus, truck
  device: "cpu"

signal_timing:
  min_green: 6
  max_green: 20
  yellow_duration: 3
  all_red_duration: 1
  starvation_threshold: 3
  emergency_duration: 12

density_thresholds:
  low_max: 3
  medium_max: 8

regions:
  road1:
    - [0.44375, 0.0]
    - [0.5, 0.0]
    - [0.5, 0.43375]
    - [0.44375, 0.43375]
  road2:
    - [0.56625, 0.44375]
    - [1.0, 0.44375]
    - [1.0, 0.5]
    - [0.56625, 0.5]
  road3:
    - [0.5, 0.56625]
    - [0.55625, 0.56625]
    - [0.55625, 1.0]
    - [0.5, 1.0]
  road4:
    - [0.0, 0.5]
    - [0.43375, 0.5]
    - [0.43375, 0.55625]
    - [0.0, 0.55625]

serial:
  enabled: false
  port: "COM3"
  baud_rate: 115200

logging:
  output_csv: "data/processed/traffic_telemetry.csv"
  log_interval_seconds: 1.0